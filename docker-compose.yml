version: "3.9"

services:
  agentwall-api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+asyncpg://agentwall:agentwall@postgres:5432/agentwall
      - REDIS_URL=redis://redis:6379/0
      - ENVIRONMENT=development
      - LOG_LEVEL=DEBUG
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./apps/api:/app
    networks:
      - agentwall-internal
      - agentwall-agents

  agentwall-dashboard:
    build:
      context: ./apps/dashboard
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
      - API_URL=http://agentwall-api:8000
    depends_on:
      - agentwall-api
    volumes:
      - ./apps/dashboard:/app
      - /app/node_modules
      - /app/.next
    networks:
      - agentwall-internal

  postgres:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=agentwall
      - POSTGRES_PASSWORD=agentwall
      - POSTGRES_DB=agentwall
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agentwall"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - agentwall-internal

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - agentwall-internal

  # Demo MCP servers (for testing and attack playground)
  demo-github-mcp:
    build:
      context: ./mcp-servers/demo-github
      dockerfile: Dockerfile
    ports:
      - "8001:8001"
    networks:
      - agentwall-internal

  demo-database-mcp:
    build:
      context: ./mcp-servers/demo-database
      dockerfile: Dockerfile
    ports:
      - "8002:8002"
    networks:
      - agentwall-internal

volumes:
  postgres-data:
  redis-data:

networks:
  # Internal network: AgentWall, PostgreSQL, Redis, MCP servers
  agentwall-internal:
    driver: bridge
  # Agent-facing network: only AgentWall is exposed
  agentwall-agents:
    driver: bridge
